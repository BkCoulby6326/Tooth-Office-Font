<section class="hero">
    @for (banner of banners; track banner.image; let index = $index) {
        <div
            class="banner-slide"
            [class.banner-slide--active]="index === activeBannerIndex()"
          
            [style.background-image]="'url(' + banner.image + ')'"
            aria-hidden="true"
        ></div>
    }

    <div class="overlay">

        <h1>{{ banners[activeBannerIndex()].title }}</h1>

        <p>{{ banners[activeBannerIndex()].description }}</p>

    </div>

</section>
