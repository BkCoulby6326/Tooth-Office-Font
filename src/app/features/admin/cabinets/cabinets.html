<div class="content-grid">

    <!-- ================= FORMULAIRE ================= -->

    <div class="form-card">

        <h3>Ajouter un cabinet dentaire</h3>

        <form [formGroup]="cabinetForm">

            <mat-form-field appearance="outline">

                <mat-label>Nom du cabinet</mat-label>

                <input matInput formControlName="nomCabinet">

            </mat-form-field>

            <mat-form-field appearance="outline">

                <mat-label>Adresse complète</mat-label>

                <input matInput formControlName="adresse">

            </mat-form-field>

            <mat-form-field appearance="outline">

                <mat-label>Téléphone</mat-label>

                <input matInput formControlName="tel">

            </mat-form-field>

            <!-- <mat-form-field appearance="outline">

                <mat-label>Email</mat-label>

                <input matInput formControlName="email">

            </mat-form-field> -->

            <mat-form-field appearance="outline">

                <mat-label>Description</mat-label>

                <textarea
                    matInput
                    rows="4"
                    formControlName="description">
                </textarea>

            </mat-form-field>

            <button
                mat-flat-button
                class="create-btn"
                (click)="enregistrer()">

                Créer le cabinet

            </button>

        </form>

    </div>

    <!-- ================= TABLEAU ================= -->

    <div class="table-card">

        <h3>Liste des cabinets d'enregistrement</h3>

        <table
            mat-table
            [dataSource]="cabinets">

             <!-- Cabinet -->

            <ng-container matColumnDef="cabinet">

                <th mat-header-cell *matHeaderCellDef>

                    Cabinet

                </th>

                <td mat-cell *matCellDef="let c">

                    {{c.nomCabinet}}

                </td>

            </ng-container>

            <!-- Contact -->

            <ng-container matColumnDef="contact">

                <th mat-header-cell *matHeaderCellDef>

                    Contact

                </th>

                <td mat-cell *matCellDef="let c">

                    {{c.tel}}

                </td>

            </ng-container>

            <!-- Note -->

            <ng-container matColumnDef="note">

                <th mat-header-cell *matHeaderCellDef>

                    Note

                </th>

                <td mat-cell *matCellDef="let c">

                     {{c.adresse}}

                </td>
                <td mat-cell *matCellDef="let c">

                     {{c.description}}

                </td>

            </ng-container>

            <!-- Actions -->

            <ng-container matColumnDef="actions">

                <th mat-header-cell *matHeaderCellDef>

                    Actions

                </th>

                <td mat-cell *matCellDef="let c">

                    <button mat-icon-button color="primary">

                        <mat-icon>edit</mat-icon>

                    </button>

                    <button mat-icon-button color="warn" (click)="supprimer(c.id!)">

                        <mat-icon>delete</mat-icon>

                    </button>

                </td>

            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        

        </table>

    </div>

</div>
