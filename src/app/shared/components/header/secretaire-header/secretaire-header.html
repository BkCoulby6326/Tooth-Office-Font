<mat-toolbar class="header shadow-sm px-5 bg-white">

    <div class="container-fluid d-flex align-items-center justify-content-between">

        <!-- Logo -->
        <a routerLink="/" class="logo d-flex align-items-center text-decoration-none text-dark">

            <img
                src="/assets/images/logo.png"
                alt="Logo"
                style="height: 45px;"> <!-- Ajustez la hauteur selon votre image -->

            <div class="ms-2">

                <h4 class="mb-0 fw-bold text-dark">
                    Tooth Office
                </h4>

                <small class="text-secondary fw-semibold text-uppercase" style="font-size: 0.75rem; letter-spacing: 0.5px;">
                    SYSTÈME DENTAIRE
                </small>

            </div>

        </a>

        <!-- Profil Secrétaire (Aligné à droite) -->
        <div class="text-end">
            
            <!-- Nom de la secrétaire -->
            <h5 class="mb-0 fw-bold text-dark">
                {{ SecretaireName }}
            </h5>
            
            <!-- Statut avec le point violet -->
            <div class="d-flex align-items-center justify-content-end mt-1">
                <span class="rounded-circle me-2" style="width: 8px; height: 8px; background-color: #5c5fc8;"></span>
                <small class="fw-bold text-uppercase" style="color: #8fa0dd; font-size: 0.75rem; letter-spacing: 0.5px;">
                    SECRETAIRE
                </small>
            </div>

        </div>

    </div>

</mat-toolbar>
