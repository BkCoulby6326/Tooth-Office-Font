<div class="dashboard-page">
  <div class="dashboard-card">
    <h1>Accueil</h1>
    <p class="subtitle">Bienvenue sur Tooth Office. Identifiez-vous pour accéder à votre espace.</p>

    <ng-container *ngIf="user$ | async as user; else guest">
      <p class="welcome">Bonjour, {{ user.email }}</p>
      <p>Rôle : {{ user.role }}</p>
      <button (click)="logout()">Se déconnecter</button>
    </ng-container>

    <ng-template #guest>
      <div class="actions">
        <a routerLink="/login" class="primary-btn">Se connecter</a>
        <a routerLink="/register" class="secondary-btn">Créer un compte</a>
      </div>
    </ng-template>
  </div>
</div>
