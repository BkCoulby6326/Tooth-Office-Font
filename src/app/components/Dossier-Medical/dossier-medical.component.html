<div class="container mt-5">
  <div class="row g-4">
    <!-- Formulier de création -->
    <div class="col-md-5">
      <div class="card border-0 shadow-sm rounded-4 p-4">
        <h4 class="fw-bold mb-4">Créer un Dossier Médical</h4>
        <form [formGroup]="dossierForm" (ngSubmit)="onSubmit()">
          
          <div class="mb-3">
            <label class="form-label small text-secondary">ID du Patient</label>
            <input type="number" formControlName="patientId" class="form-control bg-light border-0 py-2">
          </div>

          <div class="mb-3">
            <label class="form-label small text-secondary">Antécédents</label>
            <textarea formControlName="antecedents" rows="2" class="form-control bg-light border-0"></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label small text-secondary">Allergies</label>
            <textarea formControlName="allergies" rows="2" class="form-control bg-light border-0"></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label small text-secondary">Historique des traitements</label>
            <textarea formControlName="historiques" rows="2" class="form-control bg-light border-0"></textarea>
          </div>

          <button type="submit" class="btn btn-primary w-100 rounded-3" style="background-color: #7F27FF; border: none;" [disabled]="dossierForm.invalid">
            Enregistrer le Dossier
          </button>
        </form>
      </div>
    </div>

    <!-- Liste des Dossiers -->
    <div class="col-md-7">
      <div class="card border-0 shadow-sm rounded-4 p-4">
        <h4 class="fw-bold mb-4">Dossiers Médicaux Enregistrés</h4>
        <div class="table-responsive">
          <table class="table table-hover">
            <thead class="table-light small text-uppercase">
              <tr>
                <th>Patient ID</th>
                <th>Antécédents</th>
                <th>Allergies</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let d of dossiers">
                <td>Patient #{{ d.patientId }}</td>
                <td class="text-truncate" style="max-width: 150px;">{{ d.antecedents }}</td>
                <td class="text-truncate" style="max-width: 150px;">{{ d.allergies }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
