<div class="table-container">
    <h2>Tarifs de nos prestations dentaires</h2>

    <!-- En-tête -->
    <div class="table-header">
        <span>SOIN & PRESTATION</span>
        <span>DUREE ESTIME</span>
        <span>TARIF CLINIQUE</span>
    </div>

    <!-- Lignes de données dynamiques -->
    @if (soins.length > 0) {
        @for (soin of soins; track soin.id) {
            <div class="table-row">
                <!-- Nom du soin -->
                <span>{{ soin.typeSoin }}</span>
                
                <!-- Durée (avec le suffixe "minutes") -->
                <span>{{ soin.duree }} minutes</span>
                
                <!-- Prix (formaté avec le pipe number) -->
                <span class="price">{{ soin.tarifClinique | number:'1.0-0' }} F CFA</span>
            </div>
        }
    } @else {
        <!-- Message si la liste est vide -->
        <div class="table-row">
            <span>Aucun tarif disponible pour le moment.</span>
        </div>
    }
</div>
