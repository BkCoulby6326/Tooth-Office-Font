<div class="container py-3">
  
  <!-- Contenu Dynamique (Affiché directement si cabinet existe) -->
  @if (cabinet) {
    <div class="card shadow-sm border-0 rounded-4 p-3">
      <div class="row g-4 align-items-center">

        <!-- Logo / Image -->
        <div class="col-lg-4">
          <div class="position-relative">
            <img
              [src]="cabinet.logo"
              class="img-fluid rounded-4 w-100"
              [alt]="cabinet.nomCabinet"
              (error)="onImageError($event)">

            <span class="badge bg-success position-absolute top-0 start-0 m-3 px-3 py-2 rounded-pill">
              <i class="bi bi-patch-check-fill me-1"></i>
              Agréé Tooth Office
            </span>
          </div>
        </div>

        <!-- Informations -->
        <div class="col-lg-8">
          
          <!-- Badge -->
          <div class="d-flex align-items-center gap-2 mb-2">
            <span class="badge text-bg-info text-uppercase">
              Cabinet Dentaire
            </span>
          </div>

          <!-- Nom du Cabinet -->
          <h2 class="fw-bold mb-2">
            {{ cabinet.nomCabinet }}
          </h2>

          <!-- Description -->
          <p class="text-secondary mb-4">
            {{ cabinet.description || 'Aucune description disponible.' }}
          </p>

          <hr>

          <!-- Grille d'informations -->
          <div class="row gy-4">

            <!-- Adresse -->
            @if (cabinet.adresse) {
              <div class="col-md-6">
                <div class="d-flex">
                  <div class="me-3 text-primary"><i class="bi bi-geo-alt fs-4"></i></div>
                  <div>
                    <small class="text-muted d-block">Adresse</small>
                    <strong>{{ cabinet.adresse }}</strong>
                  </div>
                </div>
              </div>
            }

            <!-- Téléphone -->
            @if (cabinet.tel) {
              <div class="col-md-6">
                <div class="d-flex">
                  <div class="me-3 text-primary"><i class="bi bi-telephone fs-4"></i></div>
                  <div>
                    <small class="text-muted d-block">Téléphone</small>
                    <strong>
                      <a [href]="'tel:' + cabinet.tel" class="text-decoration-none text-dark">
                        {{ cabinet.tel }}
                      </a>
                    </strong>
                  </div>
                </div>
              </div>
            }

          </div>
        </div>
      </div>
    </div>
  } @else {
    <!-- Message optionnel si aucune donnée n'est trouvée (remplace le chargement) -->
    <div class="alert alert-warning text-center">Aucun cabinet trouvé.</div>
  }

</div>
